name: backup-postgres
# ADR-026 §7: pg_dump semanal criptografado. Segredos do repositório: DATABASE_PUBLIC_URL e BACKUP_PASSPHRASE.
on:
  schedule:
    - cron: "0 6 * * 0" # domingo 03:00 BRT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump criptografado
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/backup.sh finance-backup.dump.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: finance-backup-${{ github.run_id }}
          path: finance-backup.dump.gpg
          retention-days: 35
          if-no-files-found: error
