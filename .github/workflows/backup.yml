name: backup-postgres
# ADR-031 §8 (adapta ADR-026 §7): pg_dump criptografado do Prisma Postgres, fora do provedor.
# Segredos do repositório: DATABASE_DIRECT_URL (URL DIRETA, db.prisma.io, não a pooled) e BACKUP_PASSPHRASE.
# Diário porque o plano Free do Prisma Postgres não tem snapshot automático (se virar Starter+, pode voltar a semanal).
on:
  schedule:
    - cron: "0 6 * * *" # diário 03:00 BRT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump criptografado
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/backup.sh finance-backup.dump.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: finance-backup-${{ github.run_id }}
          path: finance-backup.dump.gpg
          retention-days: 35
          if-no-files-found: error
